<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlôBag · JA Pernambuco</title>
<meta name="description" content="FlôBag — a pouch de corrida com QR de emergência. Ative a sua e corra com segurança.">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f2e8;--card:#fdfaf3;--fg:#1a2238;--bd:#dfd6c4;--pri:#e4501a;--sec:#1f2f57;--secfg:#fdfaf3;--acc:#f9c823;--mut:#65708c;--ok:#2f7a55;--bad:#c62f26}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152a;--card:#182040;--fg:#f7f2e8;--bd:#2b3562;--sec:#243766;--mut:#9aa5c4;--ok:#6fcf9b}}
:root[data-theme="dark"]{--bg:#10152a;--card:#182040;--fg:#f7f2e8;--bd:#2b3562;--sec:#243766;--mut:#9aa5c4;--ok:#6fcf9b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 Manrope,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Syne,Manrope,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.05}
.mono{font:500 10px/1.4 'DM Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 22px;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 17px Syne,sans-serif}
.logo i{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--pri);color:#fff;box-shadow:3px 3px 0 var(--acc);font-style:normal;font-size:18px}
.logo small{display:block;font:500 9px 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px}
.hero{background:var(--sec);color:var(--secfg);border-radius:24px;padding:26px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:180px;height:180px;border-radius:50%;border:20px solid rgba(249,200,35,.17)}
.hero>*{position:relative}
.av{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--acc);color:#1a2238;font:800 22px Syne,sans-serif;box-shadow:4px 4px 0 var(--pri);flex:none}
.row{display:flex;gap:16px;align-items:center}
.grid{display:grid;gap:18px}
@media(min-width:800px){.g2{grid-template-columns:1fr 360px}.f2{grid-template-columns:1fr 1fr}}
.f2{display:grid;gap:14px}.f2 .full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700}
input,select,textarea{width:100%;margin-top:6px;padding:12px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
input:disabled,select:disabled{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:700 13px Manrope,sans-serif;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .15s;text-align:center}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:3px 3px 0 var(--acc)}
.btn.p:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--acc)}
.btn:active{transform:translate(2px,2px)}
.btn.p:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--acc)}
.btn.p.ring{animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{box-shadow:3px 3px 0 var(--acc),0 0 0 0 color-mix(in srgb,var(--pri) 55%,transparent)}70%,100%{box-shadow:3px 3px 0 var(--acc),0 0 0 16px transparent}}
.btn.d{color:var(--bad);border-color:rgba(198,47,38,.35)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qrbox{background:#faf7ef;border-radius:18px;padding:8px;width:min(100%,300px);margin:16px auto 0;border:1px solid var(--bd);position:relative;overflow:visible}
.qrbox svg{display:block;width:100%;height:auto}
.qrbox:before,.qrbox:after{content:"";position:absolute;width:34px;height:34px;border:5px solid var(--pri);pointer-events:none}
.qrbox:before{left:-8px;top:-8px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.qrbox:after{right:-8px;bottom:-8px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scan{position:absolute;left:10px;right:10px;top:8%;height:3px;border-radius:3px;background:var(--pri);box-shadow:0 0 12px 2px var(--pri);opacity:0;animation:sweep 1.5s ease-in-out 1s 2}
.qrbox:hover .scan{animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{top:6%;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:92%;opacity:0}}
.link{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg);font:400 10px 'DM Mono',monospace;word-break:break-all;color:var(--mut);max-height:64px;overflow:hidden}
.info{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--bg);border-radius:12px;padding:12px}
.tile b{display:block;margin-top:4px;font-size:13px}
.note{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(249,200,35,.16);border:1px solid rgba(249,200,35,.5);font-size:12.5px}
.warn{margin-top:16px;padding:14px 16px;border-radius:12px;background:rgba(198,47,38,.10);border:1px solid rgba(198,47,38,.4);font-size:13px}
.ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(47,122,85,.13);border:1px solid rgba(47,122,85,.35);color:var(--ok);font-weight:800;font-size:13px;margin-bottom:16px}
.tog{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.tog input{width:auto;margin:4px 0 0;transform:scale(1.5)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--sec);color:var(--secfg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{display:none}
@media print{#app,#toast{display:none!important}#sheet{display:block;text-align:center;padding:40px;color:#000}#sheet svg{width:340px;height:340px}body{background:#fff}}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-radial-gradient(circle at 108% -8%,transparent 0 26px,color-mix(in srgb,var(--pri) 9%,transparent) 26px 28px)}
.bib{position:relative;background:var(--card);color:var(--fg);border:2px solid var(--fg);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--pri);transform:rotate(-.6deg);animation:drop .8s cubic-bezier(.2,1.5,.4,1) both}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--fg);z-index:2}
.pin.a{left:12px;top:12px}.pin.b{right:12px;top:12px}.pin.c{left:12px;bottom:12px}.pin.d{right:12px;bottom:12px}
.bib-band{display:flex;justify-content:space-between;gap:10px;background:var(--sec);color:var(--secfg);padding:10px 36px;font:700 12px/1.2 Manrope,sans-serif}
.bib-body{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 36px}
.bib-no{font:800 clamp(56px,15vw,100px)/.82 Syne,sans-serif;letter-spacing:-.06em;color:var(--pri)}
.bib-tear{display:flex;flex-wrap:wrap;gap:6px 22px;padding:13px 36px;border-top:2px dashed var(--fg);font-size:13px;color:var(--mut)}
.bib-tear b{color:var(--fg)}
@keyframes drop{from{opacity:0;transform:translateY(-22px) rotate(-4deg)}}
.ready{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--bd)}
.ready-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}.ready-top span{color:var(--mut)}
.bar{height:10px;margin-top:10px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--acc));animation:grow 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.bib{transform:none}.scan{display:none}}
.empty{text-align:center;padding:44px 24px}
.empty .av{margin:0 auto 18px;width:80px;height:80px;font-size:26px}
.loading{text-align:center;padding:70px 0;color:var(--mut);font:500 12px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font:700 11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tag.new{background:rgba(249,200,35,.22);border-color:rgba(249,200,35,.6);color:var(--pri)}
.tokenbox{margin-top:16px;padding:18px;border-radius:14px;background:var(--sec);color:var(--secfg);text-align:center}
.tokenbox .tok{font:800 clamp(16px,4.5vw,24px) 'DM Mono',monospace;letter-spacing:.1em;word-break:break-all;line-height:1.35;margin:10px 0}
.owned{display:grid;gap:10px;margin-top:14px}
.owned-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);text-align:left;cursor:pointer;transition:border-color .15s}
.owned-item:hover{border-color:var(--pri)}
.owned-item .av{width:44px;height:44px;font-size:14px;box-shadow:3px 3px 0 var(--pri)}
.owned-item b{display:block;font-size:14px}
.owned-item small{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL='https://cwxcqfnwnosbvdshizwj.supabase.co';
const SUPABASE_KEY='sb_publishable_SNxt31cnZVXc7uuYFhNo1w_6tLmhG4q';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>(n||'').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const bibNo=p=>{let h=0;for(const c of (p.name||'')+(p.cPhone||'')+(p.public_id||''))h=(h*31+c.charCodeAt(0))>>>0;return String(h%9000+1000)};
const publicLink=pid=>location.href.split('#')[0]+'#/e/'+pid;

/* Lista de FlôBags deste aparelho: [{pid, token}] */
const MINE='flobag-mine';
const getMine=()=>{try{return JSON.parse(localStorage.getItem(MINE)||'[]')}catch{return[]}};
const setMine=a=>localStorage.setItem(MINE,JSON.stringify(a));
const addMine=(pid,token)=>{const m=getMine().filter(x=>x.pid!==pid);m.push({pid,token});setMine(m)};
const rmMine=pid=>setMine(getMine().filter(x=>x.pid!==pid));
const findMine=pid=>getMine().find(x=>x.pid===pid);

/* Mapeia linhas do banco para objetos do app */
const fromDb=r=>({
  id:r.id,public_id:r.public_id,
  label:r.label,name:r.name,nickname:r.nickname,city:r.city,group:r.group,initials:r.initials,
  cName:r.c_name,cPhone:r.c_phone,allergies:r.allergies,blood:r.blood,meds:r.meds,msg:r.msg,showMed:r.show_med
});
const fromPublic=r=>({
  public_id:r.public_id,name:r.name,nickname:r.nickname,city:r.city,group:r.group,initials:r.initials,
  cName:r.c_name,cPhone:r.c_phone,allergies:r.allergies,blood:r.blood,meds:r.meds,msg:r.msg,
  showMed:r.show_med,claimed:r.claimed
});

/* ===================== UI UTILS ===================== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
const loading=(m='Carregando…')=>{app.innerHTML=`<div class="wrap"><div class="loading">${esc(m)}</div></div>`};
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas'),x=c.getContext&&c.getContext('2d');if(!x)return;
 c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
 const cs=getComputedStyle(document.documentElement),cols=['--pri','--acc','--sec'].map(v=>cs.getPropertyValue(v).trim()||'#e4501a');
 const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*17,vy:-Math.random()*15-4,r:Math.random()*6,s:6+Math.random()*7,col:cols[Math.random()*3|0]}));let t=0;
 (function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(q=>{q.vy+=.32;q.x+=q.vx;q.y+=q.vy;q.r+=.2;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.col;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});if(++t<120)requestAnimationFrame(f);else c.remove()})()}
function makeQR(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q}catch{return null}}
function qrSvg(q){const n=q.getModuleCount(),m=2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;const s=n+2*m;return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" role="img" aria-label="QR Code"><rect width="${s}" height="${s}" fill="#faf7ef"/><path d="${d}" fill="#17233d"/></svg>`}
function qrPng(q,name){const n=q.getModuleCount(),m=2,z=Math.ceil(1000/(n+2*m)),s=(n+2*m)*z,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#faf7ef';x.fillRect(0,0,s,s);x.fillStyle='#17233d';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*z,(r+m)*z,z,z);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`flobag-${(name||'qr').toLowerCase().replace(/\W+/g,'-')}.png`;document.body.appendChild(a);a.click();a.remove()}
const head=(right='')=>`<header class="top"><a class="logo" href="#/"><i>⚡</i><span>FlôBag<small>JA Pernambuco</small></span></a>${right}</header>`;

function ready(p){const it=[['sua cidade',p.city],['mensagem para quem ajudar',p.msg],['grupo de corrida',p.group],['informações de saúde',p.showMed&&(p.allergies||p.blood||p.meds)],['nome e telefone do contato',p.cName&&p.cPhone],['seu nome',p.name]],miss=it.filter(x=>!x[1]).map(x=>x[0]),pc=Math.round((it.length-miss.length)/it.length*100);
 return `<div class="ready"><div class="ready-top"><b>Perfil ${pc}% pronto</b><span>${miss.length?'Falta: '+esc(miss.slice(0,2).join(', ')):'Tudo certo. Bom treino!'}</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}

/* ===================== ROUTER ===================== */
async function route(){
  const h=location.hash.slice(1)||'/';
  window.scrollTo(0,0);

  if(h.startsWith('/e/')) return publicView(h.slice(3).toUpperCase());
  if(h.startsWith('/a/')) return activateView(h.slice(3).toUpperCase());

  if(h.startsWith('/p/')){
    const parts=h.split('/');
    return ownerView((parts[2]||'').toUpperCase(),(parts[3]||'').toUpperCase());
  }
  if(h.startsWith('/ed/')){
    const parts=h.split('/');
    return editView((parts[2]||'').toUpperCase(),(parts[3]||'').toUpperCase());
  }

  if(h==='/entrar') return enterView();
  return homeView();
}

/* ===================== HOME ===================== */
function homeView(){
  const mine=getMine();
  app.innerHTML=`<div class="wrap" style="max-width:680px">
    ${head(mine.length?'<span class="tag">'+mine.length+' FlôBag'+(mine.length>1?'s':'')+'</span>':'')}
    <div class="mono" style="color:var(--pri)">Sua segurança vai com você</div>
    <h1 style="font-size:clamp(34px,7vw,52px);margin:10px 0 22px">FlôBag<br><span style="color:var(--pri)">corre com segurança.</span></h1>

    ${mine.length?`
      <div class="card">
        <div class="mono">Suas FlôBags neste aparelho</div>
        <div class="owned">
          ${mine.map(m=>`<a class="owned-item" href="#/p/${esc(m.pid)}/${esc(m.token)}">
            <div class="av">${esc(m.pid.slice(0,2))}</div>
            <div style="flex:1;min-width:0"><b>${esc(m.label||('FlôBag '+m.pid.slice(0,4)))}</b><small>Código ${esc(m.pid)}</small></div>
            <span class="mono">editar →</span>
          </a>`).join('')}
        </div>
      </div>
    `:`
      <div class="card empty">
        <div class="av">⚡</div>
        <h2 style="font-size:24px;margin-bottom:8px">Como funciona</h2>
        <p style="color:var(--mut);margin:0;font-size:14.5px">Sua FlôBag tem um QR Code único. Escaneie, ative e preencha seus dados de emergência. Quem escanear depois vê suas informações e pode ligar para seu contato.</p>
      </div>
    `}

    <div class="card" style="margin-top:18px">
      <div class="mono">Já ativou em outro aparelho?</div>
      <p style="color:var(--mut);font-size:13px;margin:8px 0 14px">Cole o código e o token que você guardou.</p>
      <a class="btn" href="#/entrar" style="width:100%">Tenho código + token</a>
    </div>

    <div class="note" style="margin-top:18px">Escaneou o QR de uma FlôBag nova? O próprio QR abre a tela de ativação. Sem login, sem senha.</div>
  </div>`;
}

/* ===================== ENTER (colar pid + token) ===================== */
function enterView(){
  app.innerHTML=`<div class="wrap" style="max-width:520px">
    ${head('<a class="btn" href="#/">Voltar</a>')}
    <div class="mono" style="color:var(--pri)">Acessar FlôBag</div>
    <h1 style="font-size:clamp(28px,6vw,38px);margin:8px 0 22px">Tenho código<br>e token.</h1>
    <form id="ef" class="card">
      <label>Código da FlôBag<input name="pid" required maxlength="10" placeholder="Ex.: K7P2M9X4Q1" style="text-transform:uppercase;font-family:'DM Mono',monospace;letter-spacing:.14em"></label>
      <label style="margin-top:14px;display:block">Token<input name="token" required maxlength="24" placeholder="24 caracteres" style="text-transform:uppercase;font-family:'DM Mono',monospace;letter-spacing:.14em"></label>
      <button class="btn p" style="width:100%;margin-top:16px;min-height:50px" type="submit">Acessar →</button>
    </form>
  </div>`;
  $('#ef').onsubmit=e=>{
    e.preventDefault();
    const d=new FormData(e.target),pid=(d.get('pid')||'').toString().trim().toUpperCase(),tok=(d.get('token')||'').toString().trim().toUpperCase();
    if(!pid||!tok)return toast('Preencha os dois campos');
    location.hash=`#/p/${pid}/${tok}`;
  };
}

/* ===================== VISÃO PÚBLICA (QR) ===================== */
async function publicView(pid){
  loading('Carregando…');
  const {data,error}=await db.rpc('get_public_profile',{pid});
  if(error||!data||!data.length)return invalid();
  const p=fromPublic(data[0]);
  if(!p.claimed)return unclaimedView(p);
  pub(p);
}

function unclaimedView(p){
  app.innerHTML=`<div class="wrap" style="max-width:560px">
    ${head('<span class="tag new">Não ativada</span>')}
    <div class="card" style="text-align:center;padding:36px 26px;margin-top:8px">
      <div class="av" style="margin:0 auto 18px;width:80px;height:80px;font-size:26px">⚡</div>
      <div class="mono" style="color:var(--pri)">Código ${esc(p.public_id)}</div>
      <h1 style="font-size:clamp(28px,6vw,38px);margin:12px 0 12px">Sua FlôBag<br>ainda não foi ativada.</h1>
      <p style="color:var(--mut);margin:0 0 26px;font-size:14.5px">Ative agora e preencha seus dados de emergência. Quem escanear o QR depois vai ver essas informações e poderá ligar ou mandar mensagem para seu contato.</p>
      <a class="btn p" href="#/a/${esc(p.public_id)}" style="min-height:52px;width:100%">Ativar minha FlôBag →</a>
      <p class="mono" style="margin-top:22px;line-height:1.8">Sem cadastro · sem senha</p>
    </div>
    <div class="note" style="margin-top:18px">Ao ativar, você concorda em compartilhar com quem escanear <b>apenas os dados que preencher</b>. Você pode editar ou apagar depois, a qualquer momento.</div>
  </div>`;
}

function pub(p){
  const ph=(p.cPhone||'').replace(/\D/g,''),sms=encodeURIComponent(`Oi, ${p.cName}. Encontrei o perfil FlôBag de ${p.name}.`);
  const mine=findMine(p.public_id);
  app.innerHTML=`<div class="wrap" style="max-width:700px">${head(mine?'<a class="btn" href="#/p/'+esc(p.public_id)+'/'+esc(mine.token)+'">Editar</a>':'<span class="tag">Emergência</span>')}
  <div class="ok">✓ Perfil com informações compartilhadas pela própria pessoa</div>
  <section class="hero" style="padding:0"><div style="padding:28px"><div class="row" style="flex-wrap:wrap"><div class="av" style="width:72px;height:72px">${esc(p.initials||initials(p.name)||'??')}</div><div><div class="mono" style="color:var(--acc)">Pessoa identificada</div><h1 style="font-size:30px;margin-top:4px">${esc(p.name||'—')}</h1><div style="opacity:.65;font-size:14px;margin-top:4px">${esc(p.city||'Pernambuco')}${p.group?' · '+esc(p.group):''}</div></div><div class="bib-no" style="margin-left:auto;color:var(--acc);font-size:clamp(44px,12vw,64px)">${bibNo(p)}</div></div>
   <div style="margin-top:22px;padding:14px;border-radius:14px;background:rgba(255,255,255,.08)"><div class="mono" style="color:var(--acc)">Mensagem</div><p style="margin:8px 0 0">${esc(p.msg||'Por favor, entre em contato com a pessoa de confiança abaixo.')}</p></div></div>
   <div style="background:var(--card);color:var(--fg);padding:26px 28px"><div class="mono">Contato de emergência</div><h2 style="font-size:26px;margin:8px 0 4px">${esc(p.cName||'—')}</h2><div class="mono" style="font-size:14px;letter-spacing:.04em">${esc(p.cPhone||'—')}</div>
   <div class="actions"><a class="btn p ring" href="tel:${ph}">📞 Ligar</a><a class="btn" href="sms:${ph}?&body=${sms}">💬 Mensagem</a></div>
   ${p.showMed&&(p.allergies||p.blood||p.meds)?`<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--bd)"><div class="mono" style="margin-bottom:10px">Informações importantes</div><div class="info">${p.allergies?`<div class="tile"><span class="mono">Alergias</span><b>${esc(p.allergies)}</b></div>`:''}${p.blood?`<div class="tile"><span class="mono">Tipo sanguíneo</span><b>${esc(p.blood)}</b></div>`:''}${p.meds?`<div class="tile"><span class="mono">Medicamentos</span><b>${esc(p.meds)}</b></div>`:''}</div></div>`:''}</div></section>
  <p class="mono" style="text-align:center;margin-top:24px"><a href="#/" style="text-decoration:underline">FlôBag</a> · JA Pernambuco</p></div>`;
}

function invalid(){app.innerHTML=`<div class="wrap" style="max-width:520px;text-align:center;padding-top:60px"><div class="card"><div style="font-size:40px">⚠️</div><div class="mono" style="color:var(--pri);margin-top:14px">Código não encontrado</div><h1 style="font-size:30px;margin:10px 0">Não encontramos esta FlôBag.</h1><p style="color:var(--mut)">O link pode estar incompleto ou o QR foi removido.</p><a class="btn p" href="#/">Ir para o início</a></div></div>`}

/* ===================== ATIVAR ===================== */
async function activateView(pid){
  loading('Verificando…');
  const {data,error}=await db.rpc('get_public_profile',{pid});
  if(error||!data||!data.length)return invalid();
  const p=fromPublic(data[0]);
  if(p.claimed)return alreadyClaimed(p);

  app.innerHTML=`<div class="wrap" style="max-width:560px">
    ${head('<a class="btn" href="#/e/'+esc(pid)+'">Voltar</a>')}
    <div class="mono" style="color:var(--pri)">Código ${esc(pid)}</div>
    <h1 style="font-size:clamp(28px,6vw,38px);margin:10px 0 22px">Ativar esta<br>FlôBag.</h1>
    <div class="card">
      <p style="margin:0 0 14px;color:var(--mut);font-size:14.5px">Ao ativar, este QR passa a ser <b>seu</b> neste aparelho. Você vai receber um <b>token de segurança</b> para editar seus dados depois. Guarde bem.</p>
      <button class="btn p" id="go" style="width:100%;min-height:52px">Ativar agora →</button>
    </div>
    <div class="warn"><b>Importante:</b> o token é mostrado <b>uma única vez</b>. Se perdê-lo, não conseguimos recuperar. Anote, tire print, mande para você mesmo.</div>
  </div>`;

  $('#go').onclick=async()=>{
    $('#go').disabled=true;$('#go').textContent='Ativando…';
    const {data,error}=await db.rpc('claim_profile',{pid});
    if(error){
      toast(error.message);
      $('#go').disabled=false;$('#go').textContent='Ativar agora →';
      return;
    }
    const token=data;
    addMine(pid,token);
    showTokenOnce(pid,token);
  };
}

function showTokenOnce(pid,token){
  const txt=`FlôBag · JA Pernambuco\n\nCódigo: ${pid}\nToken: ${token}\n\nPainel: ${location.href.split('#')[0]}#/p/${pid}/${token}\nPúblico: ${publicLink(pid)}\n\nGuarde este arquivo. Sem o token não é possível editar.`;
  app.innerHTML=`<div class="wrap" style="max-width:560px">
    ${head()}
    <div class="ok">✓ FlôBag ativada com sucesso</div>
    <h1 style="font-size:clamp(28px,6vw,38px);margin:0 0 8px">Guarde este token.</h1>
    <p style="color:var(--mut);font-size:14.5px;margin:0 0 4px">Ele é a <b>única forma</b> de editar sua FlôBag depois. Mostramos só uma vez.</p>
    <div class="tokenbox">
      <div class="mono" style="color:var(--acc)">Código</div>
      <div class="tok" style="font-size:20px">${esc(pid)}</div>
      <div class="mono" style="color:var(--acc);margin-top:14px">Token</div>
      <div class="tok">${esc(token)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
        <button class="btn" id="cp" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--secfg)">Copiar</button>
        <button class="btn" id="dl" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--secfg)">Baixar .txt</button>
      </div>
    </div>
    <div class="warn" style="margin-top:16px"><b>Sem este token não há como editar.</b> Não guardamos cópia. Anote, tire print ou mande para você mesmo.</div>
    <div class="card" style="margin-top:18px">
      <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" id="ack" style="width:auto;margin:4px 0 0;transform:scale(1.4)">
        <span style="font-weight:600;font-size:14px">Guardei o token em lugar seguro</span>
      </label>
      <button class="btn p" id="next" style="width:100%;margin-top:16px;min-height:50px" disabled>Continuar e preencher meus dados →</button>
    </div>
  </div>`;
  $('#ack').onchange=e=>$('#next').disabled=!e.target.checked;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch{prompt('Copie:',txt)}};
  $('#dl').onclick=()=>{const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download=`flobag-${pid}.txt`;document.body.appendChild(a);a.click();a.remove()};
  $('#next').onclick=()=>location.hash=`#/ed/${pid}/${token}`;
}

function alreadyClaimed(p){
  const mine=findMine(p.public_id);
  app.innerHTML=`<div class="wrap" style="max-width:560px">
    ${head('<a class="btn" href="#/">Início</a>')}
    <div class="card" style="text-align:center;padding:36px 26px">
      <div style="font-size:40px">🔒</div>
      <h1 style="font-size:26px;margin:12px 0 8px">Esta FlôBag já foi ativada.</h1>
      <p style="color:var(--mut);margin:0 0 22px">Se foi você quem ativou e está neste aparelho, é só acessar pelo painel.</p>
      ${mine?`<a class="btn p" href="#/p/${esc(p.public_id)}/${esc(mine.token)}" style="min-height:50px;width:100%">Abrir minha FlôBag →</a>`:''}
      <a class="btn" href="#/e/${esc(p.public_id)}" style="width:100%;margin-top:10px">Ver ficha pública</a>
    </div>
  </div>`;
}

/* ===================== PAINEL DO DONO ===================== */
async function ownerView(pid,token){
  loading('Carregando sua FlôBag…');
  const {data,error}=await db.rpc('get_profile_for_edit',{pid,token});
  if(error||!data||!data.length)return wrongToken();
  const p=fromDb(data[0]);
  addMine(pid,token);

  const url=publicLink(pid),q=makeQR(url);
  app.innerHTML=`<div class="wrap">${head('<a class="btn" href="#/">Minhas FlôBags</a>')}
  <div class="mono" style="color:var(--pri)">Painel da FlôBag</div>
  <h1 style="font-size:clamp(32px,7vw,48px);margin:10px 0 22px">${esc(p.name||'Sua FlôBag')}${p.nickname?' <span style="color:var(--pri)">· '+esc(p.nickname)+'</span>':''}</h1>
  <div class="bib"><i class="pin a"></i><i class="pin b"></i><i class="pin c"></i><i class="pin d"></i>
   <div class="bib-band"><span>FlôBag · corre com segurança</span><span>JA Pernambuco</span></div>
   <div class="bib-body"><div class="row"><div class="av">${esc(p.initials||initials(p.name)||'??')}</div><div><h2 style="font-size:clamp(22px,5vw,30px)">${esc(p.name||'—')}</h2><div style="color:var(--mut);font-size:14px;margin-top:4px">${esc(p.city||'—')}</div></div></div><div class="bib-no">${bibNo(p)}</div></div>
   <div class="bib-tear"><span>Grupo: <b>${esc(p.group||'não informado')}</b></span><span>Contato: <b>${esc(p.cName||'não informado')}</b></span></div></div>
  ${ready(p)}
  <div class="grid g2" style="margin-top:18px">
   <div class="card"><div class="mono">Ações</div>
    <div class="actions"><a class="btn p" href="#/e/${esc(p.public_id)}" target="_blank" rel="noopener">Ver visão pública</a><button class="btn" id="cp">Copiar link público</button><button class="btn" id="dl">Baixar QR Code</button><button class="btn" id="pr">Imprimir / salvar PDF</button><a class="btn" href="#/ed/${esc(p.public_id)}/${esc(token)}" style="grid-column:1/-1">✎ Editar meus dados</a><button class="btn d" id="rm" style="grid-column:1/-1">Excluir esta FlôBag</button></div>
    <div class="note">O QR aponta para <b>#/e/${esc(p.public_id)}</b> e nunca muda. Editar dados só atualiza o que ele mostra.</div>
    <div class="note" style="margin-top:10px"><b>Token:</b> <span style="font-family:'DM Mono',monospace">${esc(token)}</span> — não compartilhe. Ele é o que permite editar.</div></div>
   <div class="card" style="text-align:center"><div class="mono" style="text-align:left">QR desta FlôBag</div><h2 style="font-size:22px;text-align:left;margin-top:8px">Público e permanente.</h2>
    ${q?`<div class="qrbox">${qrSvg(q)}<i class="scan"></i></div>`:''}
    <div class="link">${esc(url)}</div></div></div></div>`;

  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch{prompt('Copie:',url)}};
  $('#dl').onclick=()=>q?qrPng(q,p.label||p.nickname||p.name||p.public_id):toast('QR indisponível');
  $('#pr').onclick=()=>{if(!q)return toast('QR indisponível');$('#sheet').innerHTML=`<h1>${esc(p.name||'FlôBag')}</h1><p>Em caso de emergência, escaneie</p>${qrSvg(q)}<p>FlôBag · JA Pernambuco</p>`;window.print()};
  $('#rm').onclick=async()=>{
    if(!confirm('Excluir esta FlôBag? O link público para de funcionar. Não dá para desfazer.'))return;
    const {data:ok,error}=await db.rpc('delete_profile',{pid,token});
    if(error||!ok)return toast('Erro ao excluir');
    rmMine(pid);toast('FlôBag excluída');location.hash='#/';
  };
}

function wrongToken(){app.innerHTML=`<div class="wrap" style="max-width:520px;text-align:center;padding-top:60px"><div class="card"><div style="font-size:40px">🔑</div><h1 style="font-size:26px;margin:12px 0 8px">Token incorreto.</h1><p style="color:var(--mut);margin:0 0 22px">Confira se digitou o token certo — sem espaços, sem confundir 0/O ou 1/I.</p><a class="btn" href="#/entrar">Tentar novamente</a></div></div>`}

/* ===================== EDITAR ===================== */
async function editView(pid,token){
  loading('Carregando…');
  const {data,error}=await db.rpc('get_profile_for_edit',{pid,token});
  if(error||!data||!data.length)return wrongToken();
  const v=fromDb(data[0]);
  const f=k=>esc(v[k]||'');
  const sm=v.showMed!==false;
  app.innerHTML=`<div class="wrap" style="max-width:760px">
  ${head('<a class="btn" href="#/p/'+esc(pid)+'/'+esc(token)+'">Cancelar</a>')}
  <div class="mono" style="color:var(--pri)">Editar dados · ${esc(pid)}</div>
  <h1 style="font-size:clamp(28px,6vw,40px);margin:8px 0 22px">Seus dados<br>de emergência.</h1>
  <form id="f" class="grid">
  <section class="card"><div class="mono" style="margin-bottom:14px">Sobre você</div><div class="f2">
   <label class="full">Nome deste QR <small style="font-weight:400;color:var(--mut)">só você vê</small><input name="label" maxlength="30" value="${f('label')}" placeholder="Ex.: Minha FlôBag, Filha, Bike"></label>
   <label class="full">Nome completo<input name="name" required maxlength="60" value="${f('name')}" placeholder="Como podemos te chamar?"></label>
   <label>Apelido (opcional)<input name="nickname" maxlength="20" value="${f('nickname')}" placeholder="Ex.: Naná"></label>
   <label>Iniciais no cartão<input name="initials" maxlength="3" value="${f('initials')}" placeholder="AC"></label>
   <label>Cidade<input name="city" maxlength="40" value="${f('city')}" placeholder="Ex.: Recife, PE"></label>
   <label>Grupo de corrida (opcional)<input name="group" maxlength="40" value="${f('group')}" placeholder="Onde você corre?"></label></div></section>
  <section class="card"><div class="mono" style="margin-bottom:14px">Em uma emergência</div><div class="f2">
   <label>Nome do contato<input name="cName" required maxlength="50" value="${f('cName')}" placeholder="Nome e sobrenome"></label>
   <label>Telefone do contato<input name="cPhone" required type="tel" inputmode="tel" maxlength="20" value="${f('cPhone')}" placeholder="(81) 99999-9999"></label>
   <label class="full">Mensagem para quem ajudar<textarea name="msg" rows="3" maxlength="200" placeholder="Ex.: Pode me ligar, sou irmã da Ana.">${f('msg')}</textarea></label></div></section>
  <section class="card"><div class="tog"><div><div class="mono">Informações médicas</div><p style="margin:6px 0 0;color:var(--mut);font-size:13px">Opcionais. Se ativadas, aparecem para quem escanear o QR.</p></div><input type="checkbox" name="showMed" id="sm" ${sm?'checked':''} aria-label="Mostrar informações médicas"></div>
   <div class="f2" style="margin-top:16px"><label>Alergias<input name="allergies" maxlength="60" value="${f('allergies')}" placeholder="Ex.: alergia a dipirona"></label>
   <label>Tipo sanguíneo<select name="blood"><option value="">Não informar</option>${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(t=>`<option ${v.blood===t?'selected':''}>${t}</option>`).join('')}</select></label>
   <label class="full">Medicamentos contínuos<input name="meds" maxlength="80" value="${f('meds')}" placeholder="Se não usa, escreva 'Nenhum'"></label></div></section>
  <div class="note" style="margin:0">Quem tiver o QR vê o que você preencher aqui. Compartilhe só o essencial.</div>
  <button class="btn p" style="min-height:52px" type="submit">Salvar alterações →</button></form></div>`;
  const smEl=$('#sm'),med=()=>['allergies','blood','meds'].forEach(n=>document.querySelector(`[name=${n}]`).disabled=!smEl.checked);med();smEl.onchange=med;
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const btn=e.target.querySelector('button[type=submit]'),old=btn.textContent;
    const d=new FormData(e.target);
    const o={
      label:(d.get('label')||'').toString().trim()||null,
      name:(d.get('name')||'').toString().trim(),
      nickname:(d.get('nickname')||'').toString().trim()||null,
      initials:((d.get('initials')||'').toString().trim()||initials(d.get('name')||'')).toUpperCase(),
      city:(d.get('city')||'').toString().trim()||null,
      group:(d.get('group')||'').toString().trim()||null,
      cName:(d.get('cName')||'').toString().trim(),
      cPhone:(d.get('cPhone')||'').toString().trim(),
      allergies:(d.get('allergies')||'').toString().trim()||null,
      blood:(d.get('blood')||'').toString().trim()||null,
      meds:(d.get('meds')||'').toString().trim()||null,
      msg:(d.get('msg')||'').toString().trim()||null,
      showMed:smEl.checked
    };
    if(!/\d{8,}/.test((o.cPhone||'').replace(/\D/g,'')))return toast('Confira o telefone do contato');
    btn.disabled=true;btn.textContent='Salvando…';
    const {data:ok,error}=await db.rpc('update_profile',{
      pid,token,
      p_label:o.label,p_name:o.name,p_nickname:o.nickname,p_city:o.city,p_group:o.group,
      p_initials:o.initials,p_c_name:o.cName,p_c_phone:o.cPhone,
      p_allergies:o.allergies,p_blood:o.blood,p_meds:o.meds,p_msg:o.msg,p_show_med:o.showMed
    });
    if(error||!ok){toast('Erro: '+(error?error.message:'falha ao salvar'));btn.disabled=false;btn.textContent=old;return}
    toast('Dados salvos');
    setTimeout(()=>location.hash=`#/p/${pid}/${token}`,400);
  };
}

/* ===================== BOOT ===================== */
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
